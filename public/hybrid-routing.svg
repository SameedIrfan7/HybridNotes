<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">HybridNotes routing flow</title>
  <desc id="desc">The prompt is blocked if empty or a bare URL, sent to on-device Nano in private or offline mode, sent to masked cloud Flash-Lite for cloud-only or long tasks, or evaluated by a Remote Config character threshold.</desc>
  <rect width="1200" height="520" rx="24" fill="#090707"/>
  <g font-family="Inter, Arial, sans-serif" fill="#fff8e8">
    <text x="600" y="46" text-anchor="middle" font-size="30" font-weight="700">HybridNotes routing flow</text>

    <rect x="470" y="76" width="260" height="70" rx="18" fill="#241a1a" stroke="#a95a5a" stroke-width="2"/>
    <text x="600" y="118" text-anchor="middle" font-size="19" font-weight="600">User prompt / study note</text>

    <path d="M600 146v42" stroke="#d9bd8a" stroke-width="3" fill="none"/>
    <rect x="470" y="188" width="260" height="64" rx="18" fill="#241a1a" stroke="#d9bd8a" stroke-width="2"/>
    <text x="600" y="214" text-anchor="middle" font-size="17" font-weight="600">Valid note?</text>
    <text x="600" y="238" text-anchor="middle" font-size="13" fill="#cdbfb0">Not empty; not a bare URL</text>

    <path d="M470 220H340" stroke="#d9bd8a" stroke-width="3" fill="none"/>
    <rect x="80" y="188" width="260" height="64" rx="18" fill="#3a1717" stroke="#df6f70" stroke-width="2"/>
    <text x="210" y="216" text-anchor="middle" font-size="17" font-weight="700">Blocked</text>
    <text x="210" y="238" text-anchor="middle" font-size="13" fill="#efcaca">Helpful local message</text>

    <path d="M730 220h130" stroke="#d9bd8a" stroke-width="3" fill="none"/>
    <rect x="860" y="188" width="260" height="64" rx="18" fill="#241a1a" stroke="#d9bd8a" stroke-width="2"/>
    <text x="990" y="214" text-anchor="middle" font-size="17" font-weight="600">Private or offline?</text>
    <text x="990" y="238" text-anchor="middle" font-size="13" fill="#cdbfb0">Cloud-only task also blocked</text>

    <path d="M990 252v60" stroke="#d9bd8a" stroke-width="3" fill="none"/>
    <rect x="860" y="312" width="260" height="64" rx="18" fill="#18231d" stroke="#79a889" stroke-width="2"/>
    <text x="990" y="340" text-anchor="middle" font-size="17" font-weight="700">ONLY_ON_DEVICE</text>
    <text x="990" y="363" text-anchor="middle" font-size="13" fill="#bad2c1">Gemini Nano; optional map-reduce</text>

    <path d="M600 252v60" stroke="#d9bd8a" stroke-width="3" fill="none"/>
    <rect x="470" y="312" width="260" height="64" rx="18" fill="#241a1a" stroke="#d9bd8a" stroke-width="2"/>
    <text x="600" y="338" text-anchor="middle" font-size="17" font-weight="600">Shorter than threshold?</text>
    <text x="600" y="362" text-anchor="middle" font-size="13" fill="#cdbfb0">on_device_max_chars, default 1500</text>

    <path d="M470 344H340" stroke="#79a889" stroke-width="3" fill="none"/>
    <rect x="80" y="312" width="260" height="64" rx="18" fill="#18231d" stroke="#79a889" stroke-width="2"/>
    <text x="210" y="340" text-anchor="middle" font-size="17" font-weight="700">PREFER_ON_DEVICE</text>
    <text x="210" y="363" text-anchor="middle" font-size="13" fill="#bad2c1">Nano, then masked cloud fallback</text>

    <path d="M600 376v42" stroke="#d9bd8a" stroke-width="3" fill="none"/>
    <rect x="470" y="418" width="260" height="64" rx="18" fill="#24151e" stroke="#bd7186" stroke-width="2"/>
    <text x="600" y="446" text-anchor="middle" font-size="17" font-weight="700">PREFER_IN_CLOUD</text>
    <text x="600" y="469" text-anchor="middle" font-size="13" fill="#dab2be">Mask identifiers; call Flash-Lite</text>

    <path d="M730 450h130" stroke="#bd7186" stroke-width="3" fill="none"/>
    <rect x="860" y="418" width="260" height="64" rx="18" fill="#24151e" stroke="#bd7186" stroke-width="2"/>
    <text x="990" y="446" text-anchor="middle" font-size="17" font-weight="700">ONLY_IN_CLOUD</text>
    <text x="990" y="469" text-anchor="middle" font-size="13" fill="#dab2be">Deep Analyze / Translate</text>
  </g>
</svg>
